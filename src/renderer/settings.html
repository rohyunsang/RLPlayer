<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>RLPlayer</title>
  </head>
  <body>
    <!--
      Deliberately empty.

      Every control on this page is GENERATED from the settings descriptors
      modules register with `ctx.settings.define()`, plus whatever
      `ctx.settingsSection()` and `ctx.settingsComponent()` contributed. This
      file used to hardcode `<select id="hwdec">`, `<select id="vo">`,
      `<input id="subScale">` and five more, which put it in a head-on collision
      with M07, M10, M15, M17 and M19 at the same time.

      Adding a setting means adding a descriptor in your own module directory.
      It does not mean editing this file, and there is nothing here to edit.
    -->
    <main id="settingsRoot"></main>
    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
